{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; padding: 30px; text-align: center; background: rgba(139, 69, 19, 0.1); border: 2px solid #8B4513; border-radius: 10px;">
    <h1 style="color: #8B4513; margin-bottom: 20px;">{% trans "Выход" %}</h1>
    
    <p style="margin-bottom: 30px;">{% trans "Вы уверены, что хотите выйти?" %}</p>
    
    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
        {% endif %}
        <button type="submit" style="padding: 10px 20px; background: #FFD700; color: #8B4513; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">
            {% trans "Выйти" %}
        </button>
        <a href="/" style="padding: 10px 20px; background: #8B4513; color: white; text-decoration: none; border-radius: 5px;">
            {% trans "Отмена" %}
        </a>
    </form>
</div>
{% endblock %}
